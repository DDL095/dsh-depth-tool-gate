<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>dsh-depth-tool-gate banner - global tool set pruned by a policy gate into a per-role tool surface</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b26"/>
      <stop offset="1" stop-color="#1d2a40"/>
    </linearGradient>
    <radialGradient id="gateGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3e9b6d" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3e9b6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fd4a8"/>
    </marker>
  </defs>

  <rect width="920" height="200" rx="16" fill="url(#bg)" stroke="#3a4a63"/>

  <!-- header row -->
  <text x="40" y="46" fill="#f0f4fa" font-size="26" font-weight="800">dsh-depth-tool-gate</text>
  <text x="312" y="43" fill="#9fb0c8" font-size="13">tool-surface gating | deny-list | per-role briefs</text>
  <text x="880" y="28" text-anchor="end" fill="#6b7f99" font-size="10">DSH subagent tool-surface governance</text>
  <line x1="36" y1="62" x2="884" y2="62" stroke="#2b3a4d" stroke-width="1"/>

  <!-- zone 1: global tool set (three full grey rows) -->
  <rect x="40" y="76" width="240" height="72" rx="12" fill="#151f2c" stroke="#2c3a4d"/>
  <rect x="52" y="85.5" width="216" height="13" rx="4" fill="#5b6b7c"/>
  <circle cx="66" cy="92" r="3.5" fill="#b9c6d4"/>
  <rect x="80" y="89" width="120" height="5" rx="2.5" fill="#9fb0bf"/>
  <rect x="52" y="105.5" width="216" height="13" rx="4" fill="#5b6b7c"/>
  <circle cx="66" cy="112" r="3.5" fill="#b9c6d4"/>
  <rect x="80" y="109" width="120" height="5" rx="2.5" fill="#9fb0bf"/>
  <rect x="52" y="125.5" width="216" height="13" rx="4" fill="#5b6b7c"/>
  <circle cx="66" cy="132" r="3.5" fill="#b9c6d4"/>
  <rect x="80" y="129" width="120" height="5" rx="2.5" fill="#9fb0bf"/>

  <!-- thin wires: every global row converges into the gate -->
  <g fill="none" stroke="#8fa3c8" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
    <path d="M280 92 C 334 92 352 107 418 107"/>
    <path d="M280 112 C 340 112 366 108 418 107"/>
    <path d="M280 132 C 334 132 352 107 418 107"/>
  </g>

  <!-- zone 2: policy gate -->
  <circle cx="447" cy="107" r="52" fill="url(#gateGlow)"/>
  <rect x="418" y="78" width="58" height="58" rx="12" fill="#3e9b6d" stroke="#57b98a" stroke-width="1.5"/>
  <path d="M434 107 H446" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M446 98 L458 107 L446 116 Z" fill="#ffffff"/>
  <text x="486" y="111" fill="#e6f6ee" font-size="12" font-weight="600">gate</text>

  <!-- thick arrow: gated output -->
  <path d="M530 107 H690" fill="none" stroke="#7fd4a8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>

  <!-- zone 3: pruned role surface (only the rows this role needs) -->
  <rect x="700" y="76" width="180" height="72" rx="12" fill="#151f2c" stroke="#2c3a4d"/>
  <rect x="714" y="89" width="152" height="13" rx="4" fill="#5b8def"/>
  <circle cx="727" cy="95.5" r="3" fill="#eaf3ff"/>
  <rect x="739" y="92.5" width="86" height="6" rx="3" fill="#cfe0ff"/>
  <rect x="714" y="122" width="152" height="13" rx="4" fill="#7fd4a8"/>
  <circle cx="727" cy="128.5" r="3" fill="#10301f"/>
  <rect x="739" y="125.5" width="52" height="6" rx="3" fill="#cdf3e0"/>

  <!-- zone captions -->
  <text x="160" y="168" text-anchor="middle" fill="#8fa3c8" font-size="11">global tool set</text>
  <text x="447" y="168" text-anchor="middle" fill="#7fd4a8" font-size="11">policy gate</text>
  <text x="790" y="168" text-anchor="middle" fill="#7fd4a8" font-size="11">role surface</text>
</svg>
